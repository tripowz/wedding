          <canvas id="flapOut" data-layout-ignore></canvas>
          <div id="shadeOut" class="fshade"></div>
          <canvas id="seal" data-layout-ignore></canvas>
        </div>
        <div id="faceIn" class="face">
          <canvas id="flapIn" data-layout-ignore></canvas>
          <div id="shadeIn" class="fshade"></div>
        </div>
      </div>
    </div>

    <div id="card">
      <canvas id="cardPaper" data-layout-ignore></canvas>
      <svg id="frame" viewBox="0 0 780 1480" width="780" height="1480">
        <path d="M1.6,1480 L1.6,390 A388.4,388.4 0 0 1 778.4,390 L778.4,1480" fill="none" stroke="url(#goldV)" stroke-width="3.2"/>
        <g fill="none" stroke="url(#goldV)">
          <path class="draw" d="M390,30 A360,360 0 0 0 30,390 L30,1480" stroke-width="1.6" pathLength="1"/>
          <path class="draw" d="M390,30 A360,360 0 0 1 750,390 L750,1480" stroke-width="1.6" pathLength="1"/>
          <path class="draw" d="M390,40 A350,350 0 0 0 40,390 L40,1480" stroke-width="0.8" pathLength="1"/>
          <path class="draw" d="M390,40 A350,350 0 0 1 740,390 L740,1480" stroke-width="0.8" pathLength="1"/>
        </g>
      </svg>
      <svg id="orn1" class="rvc" viewBox="0 0 300 72" width="300" height="72"><use href="#ornA"/></svg>
      <div id="tBless" class="ln caps cocoa rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="tGroom" class="ln script bur rvs" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="tAmp" class="ln script gold rvs" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="tBride" class="ln script bur rvs" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <svg id="div1" class="rvc" viewBox="0 0 320 24" width="320" height="24"><use href="#divA"/></svg>
      <div id="tInv1" class="ln caps burT rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="tInv2" class="ln caps burT rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="vL" class="vr"></div><div id="vR" class="vr"></div>
      <div id="dLeft" class="col caps cocoa rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="dMonth" class="col caps gold rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="dDay" class="col caps bur rvc" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="dYear" class="col caps gold rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="dT1" class="col caps cocoa rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="dT2" class="col caps bur rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <svg id="orn2" class="rvc" viewBox="0 0 300 72" width="240" height="58"><use href="#ornA"/></svg>
      <div id="tVenue" class="ln caps bur rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="tVenue2" class="ln ital cocoa rv" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="tHosts1" class="ln script cocoaS rvs" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="tHosts2" class="ln script bur rvs" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div id="cardSheen" data-layout-ignore></div>
    </div>

    <canvas id="pocket" class="env" data-layout-ignore data-layout-allow-occlusion></canvas>
    <canvas id="sprigL" class="sprig" data-layout-ignore data-layout-allow-occlusion></canvas>
    <canvas id="sprigR" class="sprig" data-layout-ignore data-layout-allow-occlusion></canvas>
  </div>

  <div id="fg">
    <canvas id="ribFront" class="rib" width="1920" height="3180" data-layout-ignore data-layout-allow-occlusion></canvas>
    <canvas id="dust" width="1080" height="1920" data-layout-ignore data-layout-allow-occlusion></canvas>
  </div>
  <div id="sweep" data-layout-ignore></div>
  <div id="vignette" data-layout-ignore></div>
  <canvas id="grain" width="540" height="960" data-layout-ignore></canvas>

  <audio id="music" class="clip" src="assets/music.mp3" data-start="0" data-duration="28" data-media-start="8.5"
    data-track-index="1" data-volume="1" data-fade-in="0.12" data-fade-out="2.4"></audio>
</div>

<script src="assets/satin.js"></script>
<script src="assets/bake2.js"></script>
<script src="assets/ribbons.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const B = window.Bake2;

  const fontsReady = Promise.all([
    document.fonts.load('400 148px "Great Vibes"', "Bekzod & Ferangiz Бекзод и Ферангиз BFБФ"),
    document.fonts.load('400 30px "Forum"', "SIZNI TO‘YIMIZGA ПРИГЛАШАЕМ 0123456789"),
    document.fonts.load('italic 500 34px "Cormorant Garamond"', "To‘yxonasi Банкетный"),
  ]);

  fontsReady.then(() => {
    const V = Object.assign({},
      ...JSON.parse(document.documentElement.dataset.compositionVariables).map((d) => ({ [d.id]: d.default })),
      (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {});

    /* ---------- материалы ---------- */
    const KE = 1.5, KC = 1.25;
    const size = (el, w, h, k) => { el.width = Math.round(w * k); el.height = Math.round(h * k); };
    size($("#envBack"), 830, 1560, KE); size($("#pocket"), 830, 1560, KE);
    size($("#flapOut"), 830, 660, KE); size($("#flapIn"), 830, 660, KE);
    B.envelope({ back: $("#envBack"), pocket: $("#pocket"), flapOut: $("#flapOut"), flapIn: $("#flapIn") }, KE, V.mono1 + " & " + V.mono2, V.address);
    size($("#cardPaper"), 780, 1480, KC); B.card($("#cardPaper"), KC);
    $("#seal").width = $("#seal").height = 450; B.seal($("#seal"), V.mono1, V.mono2);
    size($("#sprigL"), 460, 580, 1.5); size($("#sprigR"), 460, 590, 1.5);
    B.sprig($("#sprigL"), 1.5, { base: [80, 510], dir: -1.2, bend: 0.35, len: 280, leaves: 10, leafLen: 66, goldShare: 0.35, buds: 7, seed: 5 });
    B.sprig($("#sprigR"), 1.5, { base: [382, 90], dir: 2.05, bend: 0.30, len: 290, leaves: 10, leafLen: 64, goldShare: 0.4, buds: 6, seed: 9 });
    B.grain($("#grain"));

    const silk = Satin.Silk($("#silk"), [-160, -160, 1400, 2240], { lo: [0.80, 0.68, 0.61], mid: [0.93, 0.86, 0.80], hi: [1.0, 0.975, 0.95], relief: 0.16 });
    const R = window.RIBBONS;
    const ribBack = Satin.Ribbons($("#ribBack"), [-100, -100, 1280, 2120], R.back);
    const ribFront = Satin.Ribbons($("#ribFront"), [-100, -100, 1280, 2120], R.front);
    const dustPts = B.dust(70, 21, [-40, 0, 1160, 2300]);

    /* ---------- тексты ---------- */
    const txt = { tBless: "blessing", tGroom: "groom", tAmp: "amp", tBride: "bride", tInv1: "invite1", tInv2: "invite2",
      dLeft: "weekday", dMonth: "month", dDay: "day", dYear: "year", dT1: "time1", dT2: "time2",
      tVenue: "venue", tVenue2: "venue2", tHosts1: "hosts1", tHosts2: "hosts2" };
    for (const [id, key] of Object.entries(txt)) $("#" + id).textContent = V[key];

    /* ---------- камера: плавный сплайн по ключам (t, масштаб, фокус x, фокус y) ---------- */
    const CAM = [[0, 1.03, 540, 990], [1.5, 1.10, 540, 925], [2.6, 1.085, 540, 905], [4.9, 1.0, 540, 960]];
    function camAt(t) {
      const K = CAM, n = K.length;
      if (t <= K[0][0]) return K[0].slice(1);
      if (t >= K[n - 1][0]) return K[n - 1].slice(1);
      let i = 0; while (K[i + 1][0] < t) i++;
      const t0 = K[i][0], t1 = K[i + 1][0], h = t1 - t0, u = (t - t0) / h;
      const slope = (j, c) => {
        if (j === 0 || j === n - 1) return 0;
        return (K[j + 1][c] - K[j - 1][c]) / (K[j + 1][0] - K[j - 1][0]);
      };
      const out = [];
      for (let c = 1; c <= 3; c++) {
        const p0 = K[i][c], p1 = K[i + 1][c], m0 = slope(i, c) * h, m1 = slope(i + 1, c) * h;
        const u2 = u * u, u3 = u2 * u;
        out.push((2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m1);
      }
      return out;
    }
    const smooth = (a, b, x) => { const v = Math.min(1, Math.max(0, (x - a) / (b - a))); return v * v * (3 - 2 * v); };

    const world = $("#world"), fg = $("#fg"), sprigL = $("#sprigL"), sprigR = $("#sprigR"), dustCv = $("#dust");
    const silkCv = $("#silk"), ribBackCv = $("#ribBack");
    function render(t) {
      const [s, fx, fy] = camAt(t);
      // после 4.9 с мир стоит ровно в целых пикселях — текст не перерисовывается и не дрожит
      world.style.transform = t >= 4.9 ? "none" : `translate(${540 - fx * s}px, ${960 - fy * s}px) scale(${s})`;
      const sf = 1 + (s - 1) * 1.3;                             // передний план ближе к камере
      // глубина: фон и ленты медленно плывут в разные стороны (в этих слоях нет текста)
      const d = smooth(4.0, 9.0, t), k1 = Math.sin(t * 0.21), k2 = Math.cos(t * 0.17);
      silkCv.style.transform = `translate(${(d * 7 * k1).toFixed(3)}px, ${(d * 5 * k2).toFixed(3)}px)`;
      ribBackCv.style.transform = `translate(${(d * -9 * k2).toFixed(3)}px, ${(d * 7 * k1).toFixed(3)}px)`;
      fg.style.transform = `translate(${540 - fx * sf + d * 12 * k1}px, ${960 - fy * sf + d * -10 * k2}px) scale(${sf})`;
      const blur = 7 * (1 - smooth(1.6, 4.6, t));               // перевод фокуса с печати на открытку
      $("#ribFront").style.filter = `blur(${blur.toFixed(2)}px) drop-shadow(0 26px 30px rgba(80,35,30,.30)) drop-shadow(0 5px 8px rgba(80,35,30,.18))`;
      silk(t); ribBack(t); ribFront(t);
      B.drawDust(dustCv, dustPts, t, 1, 0.55 + 0.45 * smooth(3, 6, t));
      const sw = (a, f, p) => a * Math.sin(t * f + p);
      sprigL.style.transform = `rotate(${(sw(1.1, 0.55, 0.3) + sw(0.4, 1.3, 1.9)).toFixed(3)}deg)`;
      sprigR.style.transform = `rotate(${(sw(1.0, 0.5, 2.2) + sw(0.35, 1.2, 0.7)).toFixed(3)}deg)`;
    }

    /* ---------- таймлайн ---------- */
    const tl = gsap.timeline({ paused: true });
    const clock = { t: 0 };
    tl.to(clock, { t: 28, duration: 28, ease: "none", onUpdate: () => render(clock.t) }, 0);

    const ENV = ["#envBack", "#flapWrap", "#pocket"];
    gsap.set(ENV, { y: 0 }); gsap.set("#card", { y: 0 }); gsap.set("#flap", { rotationX: 0 });
    gsap.set(["#sprigL", "#sprigR"], { opacity: 0 });

    // свет скользит по конверту
    tl.fromTo("#sweep", { x: 0 }, { x: 2300, duration: 2.4, ease: "sine.inOut" }, 0.2);

    // 1.5 — 2.7: клапан открывается (ребром к камере ровно на середине — там и меняется порядок слоёв)
    tl.fromTo("#flap", { rotationX: 0 }, { rotationX: 180, duration: 1.2, ease: "sine.inOut" }, 1.5);
    tl.fromTo("#shadeOut", { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "sine.in" }, 1.5);
    tl.fromTo("#shadeIn", { opacity: 0.7 }, { opacity: 0, duration: 0.6, ease: "sine.out" }, 2.1);
    tl.set("#flapWrap", { zIndex: 2 }, 2.1);

    // 2.4 — 4.8: открытка выходит, конверт уходит вниз кадра
    tl.to("#card", { y: -140, duration: 2.3, ease: "power2.inOut" }, 2.4);
    tl.to(ENV, { y: 1240, duration: 2.4, ease: "power2.inOut" }, 2.4);

    // веточки распускаются у краёв открытки
    tl.fromTo("#sprigL", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.5, ease: "sine.out" }, 4.3);
    tl.fromTo("#sprigR", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.5, ease: "sine.out" }, 4.5);

    const P = (sel, t, dur, ease = "sine.inOut") => tl.fromTo(sel, { "--p": 0 }, { "--p": 1, duration: dur, ease }, t);
    tl.fromTo("#frame .draw", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.9, ease: "sine.inOut", stagger: 0.08 }, 4.2);
    P("#orn1", 4.6, 1.0);
    P("#tBless", 5.0, 1.0);
    P("#tGroom", 5.6, 1.3, "power1.inOut");
    P("#tAmp", 6.6, 0.7, "power1.inOut");
    P("#tBride", 7.0, 1.4, "power1.inOut");
    P("#div1", 8.2, 0.9);
    P("#tInv1", 9.0, 1.0); P("#tInv2", 9.5, 1.0);
    tl.fromTo(["#vL", "#vR"], { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "sine.inOut" }, 10.3);
    P("#dMonth", 10.6, 0.8); P("#dDay", 10.9, 1.0); P("#dYear", 11.3, 0.8);
    P("#dLeft", 11.6, 0.9); P("#dT1", 11.9, 0.7); P("#dT2", 12.1, 0.9);
    P("#orn2", 13.2, 1.0);
    P("#tVenue", 13.6, 1.1); P("#tVenue2", 14.2, 1.0);
    P("#tHosts1", 15.2, 1.4, "power1.inOut"); P("#tHosts2", 16.4, 1.5, "power1.inOut");

    // блеск фольги и свет
    tl.fromTo(".gold", { "--g": "120%" }, { "--g": "-20%", duration: 2.0, ease: "sine.inOut" }, 8.4);
    tl.set(".gold", { "--g": "120%" }, 20.45);
    tl.to(".gold", { "--g": "-20%", duration: 2.4, ease: "sine.inOut" }, 20.5);
    tl.fromTo("#cardSheen", { x: 0, opacity: 0.9 }, { x: 1600, opacity: 0.9, duration: 3.0, ease: "sine.inOut" }, 19.6);
    tl.set("#sweep", { x: 0 }, 21.9);
    tl.to("#sweep", { x: 2300, duration: 3.0, ease: "sine.inOut" }, 22.0);

    render(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  });
})();

</script>
</body>
</html>
