<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/engine.js"></script>
<style>
@font-face { font-family: 'Cormorant Garamond'; font-weight: 300 700; font-style: normal; src: url('assets/fonts/cg.woff2') format('woff2'); }
@font-face { font-family: 'Cormorant Garamond'; font-weight: 300 700; font-style: italic; src: url('assets/fonts/cgi.woff2') format('woff2'); }
@font-face { font-family: 'Manrope'; font-weight: 200 800; src: url('assets/fonts/mr.woff2') format('woff2'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f3eee3; }
#root { position: relative; width: 100%; height: 100%; }
#stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
  <canvas id="stage" width="1080" height="1920"></canvas>
</div>
<script>
(() => {
  const PAPER = "#f4efe4", CARD = "#faf7f0", INK = "#4f4b30", WAX = "#7d7751", FOIL = "#9a9160", JUTE = "#bfae84", LINEN = "#e9e1cf", LINER = "#d9cfb8";
  const CG = (w, s, it) => `${it ? "italic " : ""}${w} ${s}px "Cormorant Garamond"`;
  const MR = (w, s) => `${w} ${s}px "Manrope"`;

  // Детерминированные «рваные» края
  function deckle(u, x, y, w, h, amp = 2.2, step = 9) {
    const P = [], j = () => (u.rnd() - 0.5) * 2 * amp;
    for (let t = 0; t <= w; t += step) P.push([x + t, y + j()]);
    for (let t = step; t <= h; t += step) P.push([x + w + j(), y + t]);
    for (let t = w - step; t >= 0; t -= step) P.push([x + t, y + h + j()]);
    for (let t = h - step; t > 0; t -= step) P.push([x + j(), y + t]);
    return (c) => { c.beginPath(); P.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py))); c.closePath(); };
  }
  function blob(u, cx, cy, r, n = 22, irr = 0.07) {
    const P = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, rr = r * (1 + (u.rnd() - 0.5) * 2 * irr + (i % 7 === 0 ? 0.08 : 0));
      P.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    return (c) => {
      c.beginPath();
      for (let i = 0; i < n; i++) {
        const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
        if (i === 0) c.moveTo(p1[0], p1[1]);
        c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
      }
      c.closePath();
    };
  }
  const circle = (x, y, r) => (c) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); };
  const poly = (pts) => (c) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); };
  function star(c, x, y, n, R, r, rot = -Math.PI / 2) {
    c.beginPath();
    for (let i = 0; i < n * 2; i++) { const a = rot + (Math.PI / n) * i, rr = i % 2 ? r : R; i ? c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : c.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath();
  }

  // Бечёвка: толстая нить с косыми прядями
  function twine(u, x0, y0, x1, y1, thick = 20, hv = 0.34) {
    const line = (c) => { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); };
    u.stroke(line, { hv: hv - 0.06, alb: JUTE, mat: 60, width: thick });
    const L = Math.hypot(x1 - x0, y1 - y0), dx = (x1 - x0) / L, dy = (y1 - y0) / L, nx = -dy, ny = dx;
    for (let s = 0; s < L; s += 7) {
      const cx = x0 + dx * s, cy = y0 + dy * s;
      const seg = (c) => { c.beginPath(); c.moveTo(cx - nx * thick * 0.45 - dx * 5, cy - ny * thick * 0.45 - dy * 5); c.lineTo(cx + nx * thick * 0.45 + dx * 5, cy + ny * thick * 0.45 + dy * 5); };
      u.stroke(seg, { hv, alb: s % 14 ? "#c9b98f" : "#ad9b70", width: 3.2 });
    }
  }

  // Сургучная печать с оттиском
  function seal(u, cx, cy, r, initials) {
    const b = blob(u, cx, cy, r * 1.05, 26, 0.06);
    u.fill(b, { hv: 0.34, alb: WAX, mat: 110 });
    u.fill(blob(u, cx, cy, r * 0.96, 26, 0.03), { hv: 0.44 });
    u.fill(circle(cx, cy, r * 0.8), { hv: 0.5 });
    u.fill(circle(cx, cy, r * 0.7), { hv: 0.42 });
    u.stroke(circle(cx, cy, r * 0.62), { hv: 0.47, width: 3, dash: [2, 9] });
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      u.fill(circle(cx + Math.cos(a) * r * 0.75, cy + Math.sin(a) * r * 0.75, 4), { hv: 0.53 });
    }
    // веточки
    [-1, 1].forEach((s) => {
      for (let k = 0; k < 5; k++) {
        const a = Math.PI / 2 + s * (0.35 + k * 0.17), rr = r * 0.52;
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        u.fill((c) => { c.beginPath(); c.ellipse(x, y, 10, 4, a + s * 0.6, 0, Math.PI * 2); }, { hv: 0.48 });
      }
    });
    u.text(initials, cx, cy - 6, CG(600, r * 0.48), { hv: 0.52 });
  }

  const shots = [
    /* B1 — печать крупно */
    { depth: 70, az: 222, el: 34, amb: 0.56, key: 0.82, draw(u) {
      u.fill(poly([[0, 0], [1080, 0], [1080, 1920], [0, 1920]]), { hv: 0.08, alb: PAPER, mat: 0 });
      // боковые клапаны и нижний
      u.fill(poly([[0, 0], [600, 1180], [0, 1920]]), { hv: 0.1, alb: "#efe9dc", mat: 0 });
      u.fill(poly([[1080, 0], [1080, 1920], [480, 1180]]), { hv: 0.1, alb: "#ece6d8", mat: 0 });
      u.fill(poly([[0, 1920], [540, 1060], [1080, 1920]]), { hv: 0.12, alb: "#f2ece0", mat: 0 });
      // верхний клапан
      u.fill(poly([[-20, -20], [1100, -20], [540, 1120]]), { hv: 0.16, alb: "#f7f2e7", mat: 0 });
      u.text("Siz uchun maxsus", 540, 1640, CG(400, 64, true), { hv: 0.095 });
      u.bevel(1.4);
      twine(u, -20, 1060, 1100, 1060, 22, 0.3);
      seal(u, 540, 1060, 230, "B&F");
      u.bevel(0.8);
    } },
    /* B2 — открытка с именами выходит из конверта */
    { depth: 60, az: 220, el: 36, amb: 0.58, key: 0.8, draw(u) {
      u.fill(poly([[0, 0], [1080, 0], [1080, 1920], [0, 1920]]), { hv: 0.02, alb: LINEN, mat: 60 });
      // конверт: задняя стенка и подкладка
      u.fill(poly([[40, 1180], [1040, 1180], [1040, 1960], [40, 1960]]), { hv: 0.08, alb: PAPER, mat: 0 });
      u.fill(poly([[70, 1190], [1010, 1190], [540, 1560]]), { hv: 0.09, alb: LINER, mat: 0 });
      for (let y = 1200; y < 1560; y += 34) for (let x = 90; x < 1000; x += 34) {
        const inside = Math.abs(x - 540) < (1560 - y) * (470 / 370);
        if (inside) u.stroke((c) => star(c, x, y, 8, 11, 7, -Math.PI / 2 + Math.PI / 8), { alb: "#b6aa86", width: 1.4 });
      }
      // открытка
      const card = deckle(u, 120, 150, 840, 1640, 2);
      u.fill(card, { hv: 0.2, alb: CARD, mat: 0 });
      u.stroke((c) => { c.beginPath(); c.rect(160, 190, 760, 1560); }, { hv: 0.188, alb: "#d4c9ad", width: 2 });
      u.fill((c) => star(c, 540, 330, 8, 34, 15, -Math.PI / 2 + Math.PI / 8), { hv: 0.185, alb: FOIL, mat: 170 });
      u.text("NIKOH TO‘YI", 540, 430, MR(600, 32), { hv: 0.188, alb: INK, tracking: 12 });
      u.text("Bekzod", 540, 610, CG(500, 150), { hv: 0.175, alb: INK });
      u.text("&", 540, 770, CG(400, 120, true), { hv: 0.188, alb: FOIL, mat: 170 });
      u.text("Ferangiz", 540, 930, CG(500, 150), { hv: 0.175, alb: INK });
      u.text("11 · 11 · 2026", 540, 1110, MR(500, 36), { hv: 0.188, alb: INK, tracking: 10 });
      // передняя стенка конверта поверх
      const pocket = poly([[40, 1960], [40, 1330], [540, 1610], [1040, 1330], [1040, 1960]]);
      u.fill(pocket, { hv: 0.26, alb: "#f1ebdf", mat: 0 });
      u.stroke(poly([[40, 1960], [540, 1610], [1040, 1960]]), { hv: 0.25, width: 3 });
      u.bevel(1.2);
    } },
    /* B3 — дата */
    { depth: 55, az: 218, el: 38, amb: 0.6, key: 0.78, draw(u) {
      u.fill(poly([[0, 0], [1080, 0], [1080, 1920], [0, 1920]]), { hv: 0.02, alb: LINEN, mat: 60 });
      u.fill(deckle(u, 70, 120, 940, 1680, 2.4), { hv: 0.2, alb: CARD, mat: 0 });
      // угловые орнаменты фольгой
      [[150, 200, 0], [930, 200, 1], [150, 1720, 3], [930, 1720, 2]].forEach(([x, y, q]) => {
        u.stroke((c) => { c.beginPath(); c.arc(x, y, 46, q * Math.PI / 2, q * Math.PI / 2 + Math.PI / 2); }, { hv: 0.205, alb: FOIL, mat: 170, width: 5 });
        u.fill((c) => star(c, x, y, 8, 20, 9, -Math.PI / 2 + Math.PI / 8), { hv: 0.205, alb: FOIL, mat: 170 });
      });
      u.text("Sana", 540, 420, CG(400, 70, true), { hv: 0.188, alb: INK });
      u.text("11", 540, 760, MR(200, 420), { hv: 0.183, alb: FOIL, mat: 170, tracking: -24 });
      u.text("NOYABR 2026", 540, 1090, MR(600, 48), { hv: 0.188, alb: INK, tracking: 18 });
      u.fill((c) => { c.beginPath(); c.rect(420, 1160, 240, 3); }, { hv: 0.19, alb: FOIL, mat: 170 });
      u.text("Chorshanba", 540, 1260, CG(500, 76), { hv: 0.185, alb: INK });
      u.text("soat 18:00", 540, 1360, CG(500, 76), { hv: 0.185, alb: INK });
      u.bevel(1.0);
    } },
    /* B4 — финал: стопка карточек, половинки печати */
    { depth: 60, az: 225, el: 40, amb: 0.6, key: 0.8, draw(u) {
      u.fill(poly([[0, 0], [1080, 0], [1080, 1920], [0, 1920]]), { hv: 0.02, alb: LINEN, mat: 60 });
      const rot = (a, x, y, w, h, hv, alb) => {
        const pts = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]].map(([px, py]) =>
          [x + px * Math.cos(a) - py * Math.sin(a), y + px * Math.sin(a) + py * Math.cos(a)]);
        u.fill(poly(pts), { hv, alb, mat: 0 });
      };
      rot(-0.09, 520, 930, 860, 1300, 0.12, "#f5f0e6");
      rot(0.06, 560, 950, 860, 1300, 0.16, "#f8f4ec");
      u.fill(deckle(u, 110, 290, 860, 1300, 2), { hv: 0.2, alb: CARD, mat: 0 });
      // блинтовая арка
      const arch = (inset) => (c) => {
        const x0 = 210 + inset, x1 = 870 - inset, ys = 640, ya = 400 + inset, yb = 1500 - inset, cx = 540;
        c.beginPath(); c.moveTo(x0, yb); c.lineTo(x0, ys);
        c.bezierCurveTo(x0, ys - 140, cx - 120, ya + 30, cx, ya); c.bezierCurveTo(cx + 120, ya + 30, x1, ys - 140, x1, ys);
        c.lineTo(x1, yb); c.closePath();
      };
      u.stroke(arch(0), { hv: 0.225, width: 6 });
      u.stroke(arch(18), { hv: 0.188, width: 2 });
      u.text("Sofinur Hall", 540, 720, CG(500, 104), { hv: 0.185, alb: INK });
      u.text("to‘yxonasi · Buxoro", 540, 820, CG(500, 54), { hv: 0.188, alb: INK });
      u.fill((c) => star(c, 540, 930, 8, 18, 8, -Math.PI / 2 + Math.PI / 8), { hv: 0.205, alb: FOIL, mat: 170 });
      u.text("Hurmat bilan,", 540, 1040, CG(400, 56, true), { hv: 0.188, alb: INK });
      u.text("Sharipovlar oilasi", 540, 1110, CG(500, 62), { hv: 0.188, alb: INK });
      u.text("Sizni kutib qolamiz", 540, 1300, CG(500, 78), { hv: 0.185, alb: FOIL, mat: 170 });
      u.bevel(1.1);
      // половинки печати и бечёвка на столе
      twine(u, 60, 1820, 520, 1700, 16, 0.12);
      twine(u, 520, 1700, 1040, 1880, 16, 0.12);
      u.fill(blob(u, 230, 1720, 92, 18, 0.08), { hv: 0.2, alb: WAX, mat: 110 });
      u.fill(circle(230, 1720, 66), { hv: 0.25 });
      u.fill(blob(u, 350, 1770, 80, 18, 0.1), { hv: 0.2, alb: WAX, mat: 110 });
      u.fill(circle(350, 1770, 54), { hv: 0.24 });
      u.bevel(0.7);
    } },
  ];

  const canvas = document.getElementById("stage");
  Promise.all([
    document.fonts.load('500 150px "Cormorant Garamond"', "BbАа"),
    document.fonts.load('italic 400 70px "Cormorant Garamond"', "Ss"),
    document.fonts.load('200 420px "Manrope"', "11"),
    document.fonts.load('600 48px "Manrope"', "NOYABR"),
  ]).then(() => {
    const renderAt = window.ReliefStills({ canvas, shots, slot: 2 });
    const tl = gsap.timeline({ paused: true, onUpdate: () => renderAt(tl.time()) });
    tl.to({}, { duration: 8 }, 0);
    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    renderAt(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  });
})();
</script>
</body>
</html>
